schema_version: "1.0"
extension:
  id: ief
  name: Iterative Evidence Framework Extension
  version: "0.10.0"
  description: Ciclos definidos por el preset, compuertas humanas verificables y criterios
    de aceptacion ejecutables
  category: process
  effect: read-write
  author: "Juan Pablo Castillo"
  repository: "https://github.com/jpcastillo714/iterative-evidence-framework"
  license: MIT
requires:
  speckit_version: ">=1.0.0"
provides:
  commands:
  - name: speckit.ief.init
    aliases:
    - ief.init
    description: Inicializa el IEF en el proyecto (scaffold, state.yml, templates)
    file: commands/ief.init.md
  - name: speckit.ief.explore
    aliases:
    - ief.explore
    description: Inicia un incremento ligero de exploración (4 pasos, sin compuertas)
    file: commands/ief.explore.md
  - name: speckit.ief.pause
    aliases:
    - ief.pause
    description: Pausa el incremento activo
    file: commands/ief.pause.md
  - name: speckit.ief.rewind
    aliases:
    - ief.rewind
    description: Retrocede a un paso anterior marcando pasos como NEEDS_REVISION
    file: commands/ief.rewind.md
  - name: speckit.ief.charter
    aliases:
    - ief.charter
    description: 'Paso 1: Crea o actualiza el Charter (build)'
    file: commands/ief.charter.md
  - name: speckit.ief.inspect
    aliases:
    - ief.inspect
    description: 'Paso 2: Inspección empírica de datos (build)'
    file: commands/ief.inspect.md
  - name: speckit.ief.contracts
    aliases:
    - ief.contracts
    description: 'Paso 3: Derivar contratos de datos (build)'
    file: commands/ief.contracts.md
  - name: speckit.ief.rules
    aliases:
    - ief.rules
    description: 'Paso 4: Codificar las reglas del incremento (build)'
    file: commands/ief.rules.md
  - name: speckit.ief.tests
    aliases:
    - ief.tests
    description: 'Paso 5: Generar tests de aceptación (build)'
    file: commands/ief.tests.md
  - name: speckit.ief.implement
    aliases:
    - ief.implement
    description: 'Paso 6: Ejecutar la implementación (build)'
    file: commands/ief.implement.md
  - name: speckit.ief.verify
    aliases:
    - ief.verify
    description: 'Paso 7: Ejecutar la suite de verificación (build)'
    file: commands/ief.verify.md
  - name: speckit.ief.status
    aliases:
    - ief.status
    description: Verifica el estado actual de los incrementos en el proyecto
    file: commands/ief.status.md
  - name: speckit.ief.next
    aliases:
    - ief.next
    description: Avanza al siguiente paso del incremento activo
    file: commands/ief.next.md
  - name: speckit.ief.prototype
    aliases:
    - ief.prototype
    description: Abre un incremento de ciclo corto (4 pasos, 1 compuerta)
    file: commands/ief.prototype.md
  - name: speckit.ief.focus
    aliases:
    - ief.focus
    description: Cambia a que incremento apuntan los comandos
    file: commands/ief.focus.md
  - name: speckit.ief.doctor
    aliases:
    - ief.doctor
    description: Diagnostica bloqueos, conflictos y olvidos del proyecto
    file: commands/ief.doctor.md
  - name: speckit.ief.adopt
    aliases:
    - ief.adopt
    description: Adopta el IEF en un proyecto que ya existe, sin mover ningun archivo
    file: commands/ief.adopt.md
  - name: speckit.ief.log
    aliases:
    - ief.log
    description: Anota trabajo que no merece un incremento (un grafico, un documento)
    file: commands/ief.log.md
  - name: speckit.ief.task
    aliases:
    - ief.task
    description: "Abre un incremento minimo: 2 pasos, ninguna compuerta"
    file: commands/ief.task.md
  - name: speckit.ief.explain
    aliases:
    - ief.explain
    description: "El linaje de una regla: de donde viene, que reemplazo, quien la sostiene"
    file: commands/ief.explain.md
  - name: speckit.ief.report
    aliases:
    - ief.report
    description: Redacta el borrador del informe del incremento con lo que el motor sabe
    file: commands/ief.report.md
  - name: speckit.ief.constitution
    aliases:
    - ief.constitution
    description: Escribe o revisa los principios del proyecto
    file: commands/ief.constitution.md
