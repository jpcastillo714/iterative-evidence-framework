    # AGENTS.md: Reglas y Contexto del Proyecto (IEF)

    Instrucciones armadas por un agente al iniciar el proyecto, a partir de la plantilla del IEF.

    * Pregúntale al motor: `python "$IEF/verify_frame.py" --mode status --json`.
    * Firma de compuertas: `--mode approve-step --by "<usuario>"`. Ojo: cae siempre sobre el incremento enfocado.

    ## Reglas propias del proyecto

    * Los datos crudos nunca se modifican.
    * Toda figura lleva la fecha de extracción en el pie.
