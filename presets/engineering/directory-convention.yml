directories:
  - path: "initiative"
    description: "Artefactos de IEF y estado."
  - path: "initiative/sources"
    description: "Descripciones y muestras empíricas de las fuentes de datos."
  - path: "scratch"
    description: "Área de pruebas para validación rápida de datos (EDA preliminar)."
  - path: "src"
    description: "Código fuente de transformaciones y pipelines."
  - path: "tests"
    description: "Pruebas de aceptación y contratos de datos (dbt tests, Great Expectations)."
  - path: "data"
    description: "Datos locales para desarrollo (no subir a git)."
  - path: "outputs"
    description: "Resultados generados por ejecuciones locales de pipelines."
