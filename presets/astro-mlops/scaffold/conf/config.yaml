# conf/config.yaml — configuración Hydra.
# Regla del preset: cero rutas absolutas y cero hiperparámetros en el código fuente.
#
# params.yaml (DVC) y este archivo describen el mismo experimento desde dos ángulos:
#   - params.yaml  -> qué invalida qué en el grafo de reproducción
#   - conf/        -> cómo se compone la ejecución (overrides, barridos, multirun)
# Si duplicas un valor entre ambos, params.yaml manda.

defaults:
  - _self_

proyecto:
  nombre: "deteccion-anomalias-instrumentacion"
  incremento: "003_pipeline_segmentacion"   # slug IEF del incremento activo

rutas:
  raw: "05_datos/raw"
  processed: "05_datos/processed"
  benchmark: "05_datos/benchmark_sintetico"
  resultados: "06_resultados"
  experimentos: "06_resultados/experimentos"

mlflow:
  # Backend local por defecto: no exige nube ni sacar telemetría del laboratorio.
  tracking_uri: "file:./06_resultados/experimentos/mlruns"
  experiment: "deteccion-anomalias-instrumentacion"
  # Etiquetas IEF: el puente entre la afirmación del informe y el run.
  tags:
    ief.increment: "003_pipeline_segmentacion"
    ief.claim: "PENDING"        # CLM-XXX — obligatorio antes de citar el run
    ief.criterion: "PENDING"    # CRT-XXX
    ief.test: "PENDING"         # TST-XXX

ejecucion:
  semilla: 42
  dispositivo: "cpu"
  n_jobs: 4
