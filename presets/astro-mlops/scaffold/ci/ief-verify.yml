# .github/workflows/ief-verify.yml
#
# Compuerta de CI del preset astro-mlops. Traduce las Human Gates del IEF a una
# condición mecánica de merge: no se integra un incremento cuyos pasos 1, 4 o 5
# no estén APPROVED, ni cuyo contrato de telemetría no valide.
#
# Copiar a .github/workflows/ en el repositorio del proyecto.

name: IEF Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pandas pyarrow numpy pytest

      - name: Estructura del estado IEF
        run: python core/scripts/verify_frame.py --mode status --project-dir .

      - name: Puertas humanas del incremento activo
        # Falla si un paso con gate quedó COMPLETED sin APPROVED.
        run: python core/scripts/verify_frame.py --mode verify-step --project-dir .

      - name: Contrato de telemetria
        # --schema-only valida la forma del contrato aunque los datos no esten en CI.
        run: |
          for c in initiative/increments/*/data-contract.yml; do
            [ -e "$c" ] || continue
            python core/scripts/validate_data_contract.py --contract "$c" --schema-only
          done

      - name: Tests de aceptacion
        run: pytest tests/ -q
