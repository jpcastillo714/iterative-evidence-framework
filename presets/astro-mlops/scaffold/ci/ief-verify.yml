# .github/workflows/ief-verify.yml
#
# Compuerta de CI: traduce las Human Gates del IEF a una condicion mecanica de merge.
# Cada paso de aqui FALLA de verdad; ninguno es decorativo.
#
# Copiar a .github/workflows/ en el repositorio del proyecto.

name: IEF Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ── Coherencia del framework ─────────────────────────────────────────
      - name: Presets validos y rutas existentes
        run: python core/scripts/verify_frame.py --mode check-preset

      - name: Estructura del bundle
        run: python core/scripts/verify_frame.py --mode check-bundle

      # ── La compuerta que de verdad bloquea el merge ──────────────────────
      - name: Compuertas humanas
        # Falla (exit 1) si un paso con compuerta quedo COMPLETED sin APPROVED.
        # Un paso PENDING no cuenta: es trabajo no empezado, no una compuerta violada.
        run: python core/scripts/verify_frame.py --mode check-gates

      - name: Artefactos del paso actual
        run: python core/scripts/verify_frame.py --mode verify-step

      # ── Contratos de datos ───────────────────────────────────────────────
      - name: Contrato de telemetria (forma)
        # --schema-only valida la forma aunque los datos no esten en CI.
        run: |
          encontrado=0
          for c in initiative/specs/data-contract.yml initiative/increments/*/data-contract.yml; do
            [ -e "$c" ] || continue
            encontrado=1
            python presets/astro-mlops/scripts/validate_data_contract.py \
              --contract "$c" --schema-only
          done
          if [ "$encontrado" = "0" ]; then
            echo "No hay ningun data-contract.yml todavia (paso 3 sin completar)."
          fi

      # ── Los criterios de aceptacion, ejecutados ──────────────────────────
      - name: Tests generados al dia respecto del YAML
        # Si alguien edito acceptance-tests.yml y no recompilo, los tests que
        # corren no son los criterios aprobados.
        run: |
          for d in initiative/increments/*/; do
            slug=$(basename "$d")
            [ -e "$d/acceptance-tests.yml" ] || continue
            python core/scripts/compile_acceptance_tests.py --increment "$slug" --check
          done

      - name: Suite de aceptacion
        run: pytest tests/ -q
