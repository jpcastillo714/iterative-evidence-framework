# ─────────────────────────────────────────────────────────────────────────────
# CRITERIOS OPERACIONALES — Paso 5 (build) · HUMAN GATE
# Preset: astro-mlops
#
# Criterios de aceptación para un detector de anomalías NO SUPERVISADO, donde no
# existe un historial de fallas etiquetado. Cada test referencia una regla BR-NNN
# del Paso 4 y se expresa en Given/When/Then ejecutable.
#
# Umbral de honestidad: un criterio que no se puede ejecutar hoy se marca
# `status: blocked` con su bloqueo declarado. No se rebaja para que quepa.
# ─────────────────────────────────────────────────────────────────────────────

schema_version: "3.1"
kind: anomaly_acceptance_criteria
increment: "<slug del incremento>"
linked_rules: "business-rules.yml"

# ─────────────────────────────────────────────────────────────────────────────
# Presupuesto de error acordado con el usuario ANTES de ver resultados.
# Esto es lo que se aprueba en el gate. Cambiarlo después exige rewind.
# ─────────────────────────────────────────────────────────────────────────────
presupuesto_operacional:
  falsas_alarmas_max_por_noche: 1.0     # lo que operaciones tolera sin dejar de mirar
  cobertura_minima: 0.60                # fracción del tiempo evaluable (no `no_evaluable`)
  lead_time_minimo_h: 24                # anticipación útil para agendar intervención
  severidad_minima_detectable_sigma: 2.0
  justificacion: >-
    <De dónde salen estos números: entrevista con operaciones, cadencia de mantenimiento,
    costo de una intervención innecesaria. Si son arbitrarios, DECIRLO.>

# ─────────────────────────────────────────────────────────────────────────────
# Banco de evaluación: fabricado, declarado y versionado
# ─────────────────────────────────────────────────────────────────────────────
banco_de_evaluacion:
  fuente_nominal: "05_datos/processed/<episodios>.parquet"
  particion:
    metodo: "temporal por episodio"
    train: "<rango de fechas>"
    val: "<rango de fechas>"
    test: "<rango de fechas>"
    nota: "Sin shuffle. Sin partición por fila. Test posterior a train en el tiempo."
  inyeccion_sintetica:
    script: "presets/astro-mlops/scripts/inject_faults.py"
    manifiesto: "05_datos/benchmark_sintetico/injections.yml"
    semilla: 7
    limitacion_declarada: >-
      Las fallas inyectadas son un modelo de degradación, no fallas reales. Acotan la
      sensibilidad del detector; no demuestran que detectará la próxima falla del equipo.
      Esta limitación va en el informe, no en una nota al pie.

tests:

  # ── Contrato ───────────────────────────────────────────────────────────────
  - test_id: "TST-ACC-001"
    linked_rule: "BR-001"
    scenario: "Ninguna consigna entra al modelo"
    given: "El contrato de telemetría con la clase declarada de cada canal"
    when: "Se construye el vector de entrada del detector"
    then: "Toda columna usada tiene clase `medicion` o `derivada`; el test falla si alguna es `consigna`, `comando` o `descartada`"
    kind: "static"
    requirement: "required"
    command: "pytest tests/test_entradas_detector.py -q"
    status: "pending"

  - test_id: "TST-ACC-002"
    linked_rule: "BR-001"
    scenario: "El contrato valida contra los datos reales"
    given: "El parquet consolidado y el data-contract.yml aprobado"
    when: "Se ejecuta el validador de contrato"
    then: "Exit code 0, sin violaciones de rango válido ni valores categóricos nuevos"
    kind: "integration"
    requirement: "required"
    command: "python presets/astro-mlops/scripts/validate_data_contract.py --contract initiative/increments/<SLUG>/data-contract.yml --data 05_datos/processed/<archivo>.parquet"
    status: "pending"

  # ── Fuga de información ────────────────────────────────────────────────────
  - test_id: "TST-ACC-003"
    linked_rule: "BR-005"
    scenario: "El escalador no ve el conjunto de prueba"
    given: "Las particiones train/val/test por episodio"
    when: "Se ajusta cualquier estadístico de normalización, PCA o umbral"
    then: "Se ajusta solo con índices de train; el test falla si algún índice de val o test aparece en el ajuste"
    kind: "negative"
    requirement: "required"
    command: "pytest tests/test_sin_fuga.py -q"
    status: "pending"

  - test_id: "TST-ACC-004"
    linked_rule: "BR-005"
    scenario: "Ningún episodio aparece en dos particiones"
    given: "Los identificadores de episodio de cada partición"
    when: "Se intersectan los conjuntos"
    then: "La intersección es vacía"
    kind: "negative"
    requirement: "required"
    status: "pending"

  # ── Dominio de validez ─────────────────────────────────────────────────────
  - test_id: "TST-ACC-005"
    linked_rule: "BR-003"
    scenario: "El detector se abstiene fuera del dominio de validez"
    given: "Un episodio que viola una condición declarada en `dominio_de_validez`"
    when: "Se ejecuta el detector sobre ese episodio"
    then: "La salida es `no_evaluable` y no se emite alarma"
    kind: "negative"
    requirement: "required"
    status: "pending"

  - test_id: "TST-ACC-006"
    linked_rule: "BR-003"
    scenario: "La cobertura evaluable alcanza el mínimo acordado"
    given: "El conjunto de prueba completo"
    when: "Se computa la fracción de tiempo evaluable"
    then: "cobertura >= presupuesto_operacional.cobertura_minima"
    kind: "integration"
    requirement: "required"
    status: "pending"

  # ── Falsas alarmas sobre nominal ───────────────────────────────────────────
  - test_id: "TST-ACC-007"
    linked_rule: "BR-006"
    scenario: "Tasa de falsas alarmas en operación nominal"
    given: "El conjunto de prueba SIN inyecciones, asumido nominal"
    when: "Se ejecuta el detector con el umbral calibrado y la confirmación k-de-n"
    then: "falsas_alarmas_por_noche <= presupuesto_operacional.falsas_alarmas_max_por_noche"
    kind: "integration"
    requirement: "required"
    command: "python presets/astro-mlops/scripts/eval_anomaly.py --scores <scores> --labels <injections.yml> --report <reporte.json>"
    status: "pending"
    nota: >-
      Este es el criterio que decide si el sistema es usable. Un detector con recall alto y
      una alarma falsa por hora se apaga la primera semana.

  # ── Sensibilidad contra el banco sintético ─────────────────────────────────
  - test_id: "TST-ACC-008"
    linked_rule: "BR-002"
    scenario: "Detección de degradación lenta a severidad mínima acordada"
    given: "Episodios nominales con deriva inyectada de severidad `severidad_minima_detectable_sigma`"
    when: "Se ejecuta el detector con el umbral fijado sobre nominal"
    then: "recall por eventos >= <objetivo> con la FAR del TST-ACC-007 sin cambiar el umbral"
    kind: "integration"
    requirement: "required"
    status: "pending"

  - test_id: "TST-ACC-009"
    linked_rule: "BR-002"
    scenario: "Curva de sensibilidad por tipo y severidad de falla"
    given: "El banco sintético completo (tipos x severidades x repeticiones)"
    when: "Se evalúa el detector sobre cada celda"
    then: "Se produce la tabla recall(tipo, severidad) y se declara el umbral de detectabilidad de cada tipo"
    kind: "integration"
    requirement: "required"
    status: "pending"
    nota: >-
      El resultado esperado NO es 'detecta todo'. Es saber qué detecta, a partir de qué
      severidad, y qué no detecta nunca. Esa tabla es un resultado de la memoria.

  - test_id: "TST-ACC-010"
    linked_rule: "BR-006"
    scenario: "Lead time de detección"
    given: "Una inyección de deriva con inicio conocido"
    when: "Se registra el instante de la primera alarma confirmada"
    then: "lead_time >= presupuesto_operacional.lead_time_minimo_h antes del cruce del límite operacional"
    kind: "integration"
    requirement: "required"
    status: "pending"

  # ── Honestidad de la métrica ───────────────────────────────────────────────
  - test_id: "TST-ACC-011"
    linked_rule: "BR-006"
    scenario: "El reporte no presenta point-adjust en solitario"
    given: "El JSON de evaluación producido por eval_anomaly.py"
    when: "Se inspecciona el reporte"
    then: "Contiene métrica por eventos, point-adjust y el delta entre ambas; el test falla si falta cualquiera"
    kind: "static"
    requirement: "required"
    status: "pending"

  # ── Reproducibilidad ───────────────────────────────────────────────────────
  - test_id: "TST-ACC-012"
    linked_rule: "BR-008"
    scenario: "El experimento se reproduce bit a bit"
    given: "El commit, el hash de datos y la semilla registrados en el run"
    when: "Se re-ejecuta el pipeline en otra máquina"
    then: "Las métricas coinciden dentro de la tolerancia declarada"
    kind: "end-to-end"
    requirement: "optional"
    status: "pending"

  # ── Validación externa (el criterio que cierra el objetivo) ────────────────
  - test_id: "TST-ACC-013"
    linked_rule: "BR-002"
    scenario: "Contraste contra historial de mantenimiento real"
    given: "El registro de intervenciones del equipo en el periodo analizado"
    when: "Se cruzan las alarmas del detector con las intervenciones registradas"
    then: "Se reporta la coincidencia temporal y el lead time real sobre cada evento documentado"
    kind: "end-to-end"
    requirement: "required"
    status: "blocked"
    bloqueo: >-
      <Quién debe entregar el historial y cuál es la fecha de corte. Si no llega, se
      declara la vía alternativa acordada y se documenta el impacto sobre el objetivo.>
    via_alternativa: >-
      <p. ej. ventana de telemetría con falla conocida aunque sea de otra unidad o periodo;
      o validación cualitativa con quien opera el equipo.>
