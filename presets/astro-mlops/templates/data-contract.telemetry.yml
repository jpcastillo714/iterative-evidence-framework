# ─────────────────────────────────────────────────────────────────────────────
# CONTRATO DE TELEMETRÍA — Paso 3 (build) / Paso 2b (exploration)
# Preset: astro-mlops
#
# Este contrato NO es documentación: es un test ejecutable.
#   python presets/astro-mlops/scripts/validate_data_contract.py \
#       --contract data-contract.yml --data ruta/al.parquet --report reporte.json
#
# Regla de oro: cada línea de abajo se deriva de EVIDENCIA de la auditoría del Paso 2,
# no de la documentación nominal del fabricante. Cuando ambas difieren, gana el dato.
# ─────────────────────────────────────────────────────────────────────────────

schema_version: "3.1"
kind: telemetry_contract
increment: "<slug del incremento>"
dataset: "<nombre del sistema instrumentado>"
created_at: "<YYYY-MM-DD>"
derivado_de: "<inspection-report.md o findings.md que sustenta cada afirmación>"

fuente:
  ruta: "<ruta o remoto DVC>"
  acceso: solo_lectura
  formato: parquet            # parquet | csv | feather
  organizacion: "<patrón de nombres de archivo>"
  n_archivos: 0
  cobertura_temporal: "<inicio> a <fin>"
  cadencia_nominal_s: 20      # periodo de archivado, NO la frecuencia del controlador

# ─────────────────────────────────────────────────────────────────────────────
# Eje temporal — la fuente de la mitad de los falsos positivos
# ─────────────────────────────────────────────────────────────────────────────
tiempo:
  columna: "timestamp"
  zona: "UTC"
  monotono: true                    # si es false, DECLARARLO: hay retrocesos reales
  duplicados_permitidos: false
  hueco_minimo_reportable_s: 120    # por debajo de esto, un salto es jitter, no hueco
  advertencia: |
    Si cada canal trae su propia columna de tiempo, concatenar por posición es INCORRECTO.
    Declarar la regla de proyección a grilla común en `consolidacion`.

# ─────────────────────────────────────────────────────────────────────────────
# Canales, agrupados por capa semántica.
#
# `clase` es obligatorio y determina qué puede hacer un modelo con el canal:
#   medicion   — el sensor mide una cantidad física del equipo. Candidato a señal de salud.
#   consigna   — lo que el controlador ORDENA. No es una medición. Describe la operación.
#   comando    — código de acción externa (del ICS, del operador).
#   ambiente   — condición externa compartida. Explica, no diagnostica.
#   derivada   — calculada por nosotros. Debe declarar su fórmula en `derivadas`.
#   descartada — sin capacidad informativa demostrada. No entra a ningún modelo.
# ─────────────────────────────────────────────────────────────────────────────
canales:

  estado_mecanico:
    descripcion: "Donde vive la salud del equipo."

    pos_real:
      columna: "stat.lrPosAng"        # nombre exacto en el archivo, si difiere de la clave
      clase: medicion
      tipo: float
      unidad: "grados"
      factor_a_fisica: 1.0            # multiplicador para pasar de entero de PLC a física
      nullable: true
      rango_valido: [0.0, 360.0]      # dominio físico admisible -> FALLA si se sale
      rango_observado: [0.0, 360.0]   # lo visto en la auditoría   -> ADVIERTE si se sale
      apto_para_modelar: false
      rol: "Posición leída por el encoder."
      advertencia: |
        No alimentar cruda a un modelo: su distribución la fija el calendario de operación,
        no la salud del mecanismo. Usar el RESIDUO respecto del modelo base.

    pos_error:
      clase: medicion
      tipo: float
      unidad: "grados"
      convencion_signo: "consigna menos posición real"
      nullable: true
      rango_valido: [-360.0, 360.0]
      rango_observado: [-1.0, 1.0]
      apto_para_modelar: true
      rol: "Error instantáneo del lazo de control."
      nota: |
        Señal de LAZO CERRADO: el controlador la empuja a cero, así que enmascara la
        degradación hasta la saturación. La información está en las colas, no en la mediana.

  consignas:
    descripcion: "Lo que el sistema ordena. Explican el movimiento; no lo diagnostican."
    vel_consigna:
      clase: consigna
      tipo: float
      unidad: "adimensional"
      valores_observados: [0, 10]     # conjunto CERRADO -> FALLA si aparece un valor nuevo
      apto_para_modelar: false
      advertencia: "Es consigna, no medición. No hay cinemática fina que extraer de aquí."

  ambiente:
    descripcion: "Condición externa. Explica variación nominal; no es salud del equipo."
    temp_ambiente:
      clase: ambiente
      tipo: float
      unidad: "grados Celsius"
      nullable: true
      rango_valido: [-20.0, 50.0]
      centinela: 0.0                  # valor imposible = sin lectura -> a NaN, nunca 0
      advertencia: "Verificar si es del equipo o compartida entre unidades antes de usarla."

  estado_logico:
    descripcion: "Máquina de estados del controlador."
    modo:
      clase: comando
      tipo: categorico
      valores_observados: [0, 1, 2]
      interpretacion_inferida:        # marcar SIEMPRE como inferida si no hay diccionario
        0: "<sin determinar>"
        1: "<...>"
        2: "<...>"
      fuente_interpretacion: "inferida estadísticamente — pendiente confirmación del proveedor"

  descartados:
    descripcion: "Auditados y excluidos, con su motivo. Se documentan para no re-auditarlos."
    estado_crudo:
      clase: descartada
      valores_observados: [0]
      motivo: "Constante en todo el periodo y en todas las unidades. Capacidad informativa nula."

# ─────────────────────────────────────────────────────────────────────────────
# Disponibilidad — casi nunca es simétrica entre unidades
# ─────────────────────────────────────────────────────────────────────────────
disponibilidad:
  UNIDAD_A:
    canales: 12
    ausentes: []
    apto_para_modelar: true
  UNIDAD_B:
    canales: 7
    ausentes: ["pos_real", "pos_error"]
    apto_para_modelar: false
    motivo: "Sin canales de posición no se puede modelar el lazo de control."

# ─────────────────────────────────────────────────────────────────────────────
# Reglas de consolidación — cada una con su motivo empírico
# ─────────────────────────────────────────────────────────────────────────────
consolidacion:
  salida: "05_datos/processed/<nombre>.parquet"
  reglas:
    - id: R1
      regla: "Ordenar por timestamp antes de cualquier merge."
      motivo: "<evidencia: N retrocesos temporales observados>"
    - id: R2
      regla: "Proyectar cada canal sobre grilla regular con merge_asof."
      parametros: { tolerance_s: 25, direction: nearest }
      motivo: "Los timestamps no coinciden entre canales."
    - id: R3
      regla: "Fuera de tolerancia queda NaN. No imputar."
      motivo: "Los NaN marcan huecos reales del archivado; imputarlos inventa operación."
    - id: R4
      regla: "Convertir centinelas a NaN."
      motivo: "Un 0 físicamente imposible significa sin lectura, no una medición de cero."

huecos_conocidos:
  total_horas_ausentes: 0
  simultaneos_en_todas_las_unidades: true
  mayores:
    - { duracion_h: 0.0, se_reanuda: "<timestamp>", nota: "<posible intervención? consultado a operaciones>" }
  advertencia: |
    Un hueco de archivado NO es una parada del equipo ni una anomalía mientras no exista un
    registro externo que lo confirme. Tratarlo como etiqueta positiva es inventar evidencia.

# ─────────────────────────────────────────────────────────────────────────────
# Variables derivadas — con fórmula y script que las produce
# ─────────────────────────────────────────────────────────────────────────────
derivadas:
  residuo:
    formula: "<observado> menos <predicción del modelo base>"
    implementado_en: "04_codigo/src/<paquete>/<modulo>.py"
    rol: "VARIABLE OBJETIVO del detector."

# ─────────────────────────────────────────────────────────────────────────────
# Dominio de validez del modelo base — el detector se ABSTIENE fuera de aquí
# ─────────────────────────────────────────────────────────────────────────────
dominio_de_validez:
  modelo_base: "<descripción del modelo cuyo residuo se monitorea>"
  condiciones:
    - "<p. ej. duración del tramo por debajo de X>"
    - "<p. ej. recorrido de la variable independiente dentro de [a, b]>"
  fuera_de_dominio: "no_evaluable"
  motivo: |
    Fuera del dominio, el residuo está dominado por error del modelo base, no por el estado
    del equipo. Alarmar ahí genera falsos positivos garantizados y destruye la confianza
    del operador en el sistema.

# ─────────────────────────────────────────────────────────────────────────────
# Segmentación operacional — define la unidad de análisis
# ─────────────────────────────────────────────────────────────────────────────
segmentacion:
  nivel_1_macro:
    criterio: "<contexto operacional, p. ej. día/noche>"
  nivel_2_episodio:
    criterio: "<qué define un episodio: mismo objetivo, misma tarea>"
    duracion_mediana_min: 0
    nota: "ESTA es la unidad de análisis y la unidad de partición train/test."
  nivel_3_micro:
    criterio: "<qué separa un régimen de otro>"
    motivo_critico: |
      Mezclar regímenes destruye la señal: una sola muestra del régimen equivocado dentro
      de una ventana basta para producir una alarma espuria.

presupuesto_para_modelado:
  nota: "Muestras válidas tras la segmentación. Si no alcanza, hay que decirlo ahora."
  UNIDAD_A: { horas_utiles: 0, n_episodios: 0, n_ventanas: 0 }

fuera_de_alcance:
  - "<lo que la cadencia de muestreo hace imposible>"
  - "<lo que la falta de un canal hace imposible>"
