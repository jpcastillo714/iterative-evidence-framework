# Hereda la numeración 00-08 del preset `academic` y añade lo que exige el ciclo MLOps.
# Un proyecto `academic` ya existente adopta este preset sin mover archivos:
# los directorios nuevos son aditivos.
directories:
  - path: "00_admin"
    description: "Estado administrativo, carta Gantt, requisitos y manuales del instrumento."
  - path: "01_idea"
    description: "Fundamento físico del sistema bajo estudio y alcance conceptual."
  - path: "02_bibliografia"
    description: "library.bib y papers. El estado del arte que sustenta las decisiones de modelado."
  - path: "03_metodologia"
    description: "Diseño experimental, protocolo de evaluación y diagramas de arquitectura."
  - path: "04_codigo/src"
    description: "Paquete instalable del proyecto. Sin rutas absolutas, sin notebooks en producción."
  - path: "04_codigo/conf"
    description: "Configuración declarativa (Hydra/YAML). Todo hiperparámetro vive aquí, no en el código."
  - path: "04_codigo/pipelines"
    description: "Etapas reproducibles del pipeline (dvc.yaml y scripts de etapa)."
  - path: "04_codigo/notebooks"
    description: "Exploración. Nada de aquí se cita en el informe sin haber migrado a src/."
  - path: "04_codigo/app"
    description: "Herramientas de exploración desplegables (Streamlit/FastAPI)."
  - path: "05_datos/raw"
    description: "Telemetría cruda. SOLO LECTURA. Idealmente fuera del repo y referenciada por DVC."
  - path: "05_datos/processed"
    description: "Derivados consolidados y versionados. Reproducibles desde raw por el pipeline."
  - path: "05_datos/benchmark_sintetico"
    description: "Banco de fallas inyectadas con su manifiesto. Es el ground truth cuando no hay historial de fallas."
  - path: "06_resultados/figuras"
    description: "Salida gráfica. Regenerable con un comando."
  - path: "06_resultados/experimentos"
    description: "Backend local de MLflow (mlruns/) y reportes de evaluación."
  - path: "07_documento"
    description: "Informe/tesis. Cada cifra referencia un VRN o un run de MLflow."
  - path: "08_presentaciones"
    description: "Avances, defensa y pósters."
  - path: "initiative"
    description: "Motor IEF: charter.md, state.yml e increments/."
  - path: "initiative/sources"
    description: "Descripción y muestras empíricas de cada fuente de telemetría."
  - path: "tests"
    description: "Tests de aceptación, contratos ejecutables y regresión numérica."
