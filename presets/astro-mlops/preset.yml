id: astro-mlops
name: "Astro MLOps / Instrumentación"
description: >-
  Preset para memorias y proyectos de detección de anomalías sobre telemetría de
  instrumentación (astronómica, industrial o mecatrónica). Extiende `academic` con
  trazabilidad MLOps (DVC + MLflow + Hydra), contratos de telemetría ejecutables y
  criterios de aceptación operacionales para aprendizaje no supervisado.
extends: academic

# La numeración 00-08 se hereda de `academic`: un proyecto que ya usa ese preset
# puede migrar a este SIN mover un solo archivo.

step_aliases:
  build:
    1_charter: "Hipótesis y Alcance"
    2_empirical_inspection: "Auditoría de Telemetría"
    3_data_contracts: "Contrato de Telemetría"
    4_business_rules: "Reglas del Detector"
    5_acceptance_tests: "Criterios Operacionales"
    6_implementation: "Pipeline y Experimentos"
    7_verification: "Evaluación y Evidencia"
  exploration:
    1_objective: "Pregunta de Investigación"
    2_analysis: "Análisis Exploratorio"
    2b_data_contract: "Formalización de Telemetría"
    3_findings: "Hallazgos"

human_gates: [1, 4, 5]

supported_increment_types:
  - build
  - exploration

# ─────────────────────────────────────────────────────────────────────────────
# Plantillas preferidas por paso (sobrescriben las genéricas de core/steps/)
# ─────────────────────────────────────────────────────────────────────────────
templates:
  3_data_contracts: "core/steps/03_data_contracts/template.telemetry.yml"
  4_business_rules: "core/steps/04_business_rules/template.detector.yml"
  5_acceptance_tests: "core/steps/05_acceptance_tests/template.anomaly.yml"

# ─────────────────────────────────────────────────────────────────────────────
# Herramientas ejecutables que este preset pone a disposición del agente.
# Rutas relativas a la raíz del bundle.
# ─────────────────────────────────────────────────────────────────────────────
tooling:
  validate_contract:
    script: "core/scripts/validate_data_contract.py"
    purpose: "Convierte el contrato de telemetría en un test ejecutable sobre los datos reales."
    step: 3
  inject_faults:
    script: "core/scripts/inject_faults.py"
    purpose: "Banco de fallas sintéticas parametrizado en unidades de sigma nominal. Genera el ground truth que la telemetría real no tiene."
    step: 5
  eval_anomaly:
    script: "core/scripts/eval_anomaly.py"
    purpose: "Evaluación por eventos, falsas alarmas por noche y lead time. Reporta point-adjust solo junto a su sesgo."
    step: 7
  evidence_run:
    script: "core/scripts/evidence_run.py"
    purpose: "Ejecuta un comando y emite la carpeta VRN de evidencia; enlaza el run de MLflow si existe."
    step: 7

# ─────────────────────────────────────────────────────────────────────────────
# Invariantes que el preset impone. Un incremento no puede violarlos sin
# actualizar el charter (y dejar constancia en el historial de state.yml).
# ─────────────────────────────────────────────────────────────────────────────
invariants:
  - id: "P1"
    rule: "Ningún canal entra a un modelo sin una `clase` declarada en el contrato (medicion | consigna | comando | ambiente | derivada | descartada)."
  - id: "P2"
    rule: "El escalador y todo estadístico de normalización se ajustan solo sobre el conjunto nominal de entrenamiento."
  - id: "P3"
    rule: "La partición train/val/test es temporal y por episodio operacional. Nunca por fila, nunca aleatoria."
  - id: "P4"
    rule: "Un detector construido sobre un modelo base declara su dominio de validez y se abstiene fuera de él."
  - id: "P5"
    rule: "El umbral se calibra sobre datos nominales, nunca sobre el conjunto que se está evaluando."
  - id: "P6"
    rule: "No se reporta point-adjust como métrica principal. Siempre acompañado de la métrica por eventos y del delta entre ambas."
  - id: "P7"
    rule: "Toda cifra publicable proviene de un run registrado (VRN + MLflow) con hash de datos, commit y semilla."

scaffold:
  source: "presets/astro-mlops/scaffold"
  note: "Copiar manualmente al proyecto según se necesite. `ief.init` no lo despliega automáticamente."
