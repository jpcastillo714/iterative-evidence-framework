directories:
  - path: "initiative"
    description: "Motor IEF: state.yml, increments/ y specs/ (la especificacion viva)."
  - path: "data/raw"
    description: "Datos de origen. SOLO LECTURA: nunca se editan en el sitio."
  - path: "data/interim"
    description: "Pasos intermedios, reproducibles desde raw."
  - path: "data/processed"
    description: "Conjuntos listos para analisis, reproducibles por el pipeline."
  - path: "notebooks"
    description: "Exploracion. Nada de aqui se cita sin haber migrado a src/."
  - path: "src"
    description: "Codigo reutilizable: limpieza, features, metricas."
  - path: "reports/figures"
    description: "Figuras. Regenerables con un comando."
  - path: "reports"
    description: "Informes y presentaciones de resultados."
  - path: "tests"
    description: "Tests de aceptacion y de las transformaciones."
