# Preset `ml` — modelos de aprendizaje automatico llevados a produccion.
#
# Anade un paso que el ciclo generico no tiene: la evaluacion del modelo es distinta de
# la verificacion del sistema. Un modelo puede pasar sus tests de integracion y aun asi
# no servir, y el criterio de "sirve" se acuerda ANTES de ver resultados.
#
# Ese paso extra es un ejemplo de lo que un preset puede hacer sin tocar el motor.

id: ml
name: "Machine Learning"
description: >-
  Entrenamiento, evaluacion y despliegue de modelos. Separa la evaluacion del modelo
  (generaliza?) de la verificacion del sistema (funciona el pipeline?).
extends: generic

cycles:
  build:
    steps:
      - key: "1_charter"
        ref: "1"
        name: "Problema y Metrica Objetivo"
        artifact: "charter.md"
        human_gate: true
        template: "core/templates/charter-template.md"
        instructions: "core/steps/01_charter/step-instructions.md"

      - key: "2_empirical_inspection"
        ref: "2"
        name: "Auditoria de Datos y Fugas"
        artifact: "inspection-report.md"
        human_gate: false
        template: "core/steps/02_empirical_inspection/template.md"
        instructions: "core/steps/02_empirical_inspection/step-instructions.md"

      - key: "3_data_contracts"
        ref: "3"
        name: "Contrato de Features"
        artifact: "data-contract.yml"
        human_gate: false
        template: "core/steps/03_data_contracts/template.yml"
        instructions: "core/steps/03_data_contracts/step-instructions.md"

      - key: "4_business_rules"
        ref: "4"
        name: "Protocolo Experimental"
        artifact: "business-rules.yml"
        human_gate: true
        template: "core/steps/04_business_rules/template.yml"
        instructions: "core/steps/04_business_rules/step-instructions.md"

      - key: "5_acceptance_tests"
        ref: "5"
        name: "Criterios de Aceptacion del Modelo"
        artifact: "acceptance-tests.yml"
        human_gate: true
        template: "core/steps/05_acceptance_tests/template.yml"
        instructions: "core/steps/05_acceptance_tests/step-instructions.md"

      - key: "6_implementation"
        ref: "6"
        name: "Pipeline y Entrenamiento"
        artifact: null
        human_gate: false
        instructions: "core/steps/06_implementation/step-instructions.md"

      # Paso propio de este preset. La evaluacion del modelo contra el criterio
      # acordado en el paso 5 ocurre antes de dar por bueno el sistema entero, y
      # lleva compuerta: publicar un modelo es una decision, no un tramite.
      - key: "6b_model_evaluation"
        ref: "6b"
        name: "Evaluacion del Modelo"
        artifact: "model-card.md"
        human_gate: true
        template: "core/templates/model-card-template.md"
        instructions: "core/steps/06b_model_evaluation/step-instructions.md"

      - key: "7_verification"
        ref: "7"
        name: "Verificacion del Sistema"
        artifact: "increment-report.md"
        human_gate: false
        template: "core/templates/increment-report-template.md"
        instructions: "core/steps/07_verification/step-instructions.md"
