directories:
  - path: "initiative"
    description: "Motor IEF: state.yml, increments/ y specs/ (la especificacion viva)."
  - path: "conf"
    description: "Configuracion declarativa. Todo hiperparametro vive aqui, no en el codigo."
  - path: "data/raw"
    description: "Datos de origen. SOLO LECTURA."
  - path: "data/processed"
    description: "Conjuntos derivados, reproducibles desde raw."
  - path: "src"
    description: "Paquete del proyecto: features, entrenamiento, evaluacion."
  - path: "pipelines"
    description: "Etapas reproducibles del pipeline."
  - path: "models"
    description: "Artefactos de modelo versionados."
  - path: "experiments"
    description: "Registro de experimentos, metricas y comparaciones."
  - path: "reports/figures"
    description: "Figuras. Regenerables con un comando."
  - path: "tests"
    description: "Tests de aceptacion, de datos y de regresion numerica."
