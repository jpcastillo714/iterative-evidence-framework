# Un framework cuyo argumento es "la verificacion debe ser mecanica, no un
# recordatorio" haria mal en no verificarse a si mismo. Estos son los mismos cuatro
# chequeos que declara bundle.yml.

name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Estructura del bundle
        run: python core/scripts/verify_frame.py --mode check-bundle

      - name: Presets y sus rutas
        run: python core/scripts/verify_frame.py --mode check-preset

      - name: Archivos de apoyo de cada paso
        run: python core/scripts/verify_frame.py --mode check-steps

      - name: Suite de tests
        run: pytest tests/ -q
