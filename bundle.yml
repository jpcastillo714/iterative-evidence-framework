schema_version: "3.1"
bundle:
  id: "iterative-evidence-framework"
  name: "Iterative Evidence Framework"
  version: "0.8.0"
  role: "framework"
  description: >-
    Extensión de spec-kit con ciclos incrementales definidos por el preset, compuertas
    humanas verificables, criterios de aceptación ejecutables y promoción de incrementos
    a una especificación viva. El núcleo es neutral respecto al dominio.
  license: "MIT"

requires:
  speckit_version: ">=0.16.0"
  python: ">=3.10"

provides:
  extensions:
    - id: "ief"
      version: "0.8.0"
      source: "./extension"

  # ───────────────────────────────────────────────────────────────────────────
  # El núcleo. Lista cerrada: cualquier otro script en core/scripts/ es código de
  # dominio que se coló, y `--mode check-bundle` lo detecta.
  # ───────────────────────────────────────────────────────────────────────────
  tools:
    - id: "verify-frame"
      description: "Motor de estado y verificación. Lee el ciclo del preset activo."
      source: "./core/scripts/verify_frame.py"
    - id: "ief-preset"
      description: "Cargador de presets con herencia; define el ciclo de trabajo."
      source: "./core/scripts/ief_preset.py"
    - id: "compile-acceptance-tests"
      description: "Traduce acceptance-tests.yml a un archivo pytest ejecutable."
      source: "./core/scripts/compile_acceptance_tests.py"

  presets:
    - id: "generic"
      description: "Ciclo base: build (7 pasos), exploration (4) y prototype (4)."
      source: "./presets/generic"
    - id: "research"
      description: "Tesis, memorias y papers. El entregable es un documento defendible."
      source: "./presets/research"
    - id: "product"
      description: "Sistemas que se despliegan y alguien mantiene."
      source: "./presets/product"
    - id: "analysis"
      description: "Responder preguntas con datos. El entregable es un hallazgo."
      source: "./presets/analysis"
    - id: "modeling"
      description: "Mixin componible: anade la Evaluacion del Modelo con compuerta y model card."
      source: "./presets/modeling"

  # El catalogo de roles y los layouts: la estructura de carpetas es un eje aparte
  # del preset, porque no varia por tipo de proyecto sino por gusto y herramientas.
  catalogs:
    - id: "roles"
      description: "Que cosas acumula un proyecto. Un rol es una necesidad, no una ruta."
      source: "./core/roles.yml"
    - id: "layouts"
      description: "Como se llaman las carpetas de cada rol: flat | numbered."
      source: "./core/layouts.yml"

# ─────────────────────────────────────────────────────────────────────────────
# Debe pasar entero antes de publicar una versión del bundle.
# ─────────────────────────────────────────────────────────────────────────────
verification:
  - "python core/scripts/verify_frame.py --mode check-bundle"
  - "python core/scripts/verify_frame.py --mode check-preset"
  - "python core/scripts/verify_frame.py --mode check-steps"
  - "pytest tests/ -q"
