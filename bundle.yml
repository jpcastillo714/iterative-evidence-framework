schema_version: "3.0"
bundle:
  id: "iterative-evidence-framework"
  name: "Iterative Evidence Framework"
  version: "0.4.0"
  role: "framework"
  description: "Bundle oficial del Iterative Evidence Framework V3 (Ciclos Build y Exploration, Multi-incremento, evidencia trazable y preset astro-mlops)"
  author: "Antigravity Team"
  license: "MIT"

requires:
  speckit_version: ">=0.16.0"

provides:
  extensions:
    - id: "ief"
      version: "0.4.0"
      source: "./extension"
  workflows:
    - id: "ief-cycle-workflow"
      version: "0.3.0"
      source: "./workflows/ief-cycle-workflow.yml"
    - id: "minimal-workflow"
      version: "0.1.0"
      source: "./workflows/minimal-workflow.yml"
  presets:
    - id: "generic"
      description: "Preset genérico para proyectos de software"
      source: "./presets/generic"
    - id: "engineering"
      description: "Preset para ingeniería de datos y pipelines"
      source: "./presets/engineering"
    - id: "academic"
      description: "Preset para proyectos académicos y tesis"
      source: "./presets/academic"
    - id: "astro-mlops"
      description: "Preset para detección de anomalías sobre telemetría de instrumentación (extiende academic con trazabilidad MLOps)"
      source: "./presets/astro-mlops"
  tools:
    - id: "validate-data-contract"
      description: "Valida un contrato de telemetría contra su forma y contra los datos reales"
      source: "./core/scripts/validate_data_contract.py"
    - id: "inject-faults"
      description: "Banco de fallas sintéticas parametrizado en unidades de sigma nominal"
      source: "./core/scripts/inject_faults.py"
    - id: "eval-anomaly"
      description: "Evaluación por eventos, falsas alarmas por unidad operacional y lead time"
      source: "./core/scripts/eval_anomaly.py"
    - id: "evidence-run"
      description: "Ejecuta un comando y emite su carpeta VRN de evidencia (enlaza MLflow si existe)"
      source: "./core/scripts/evidence_run.py"
